name: Build Rotbound Daily Chaos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: cd rotbound-daily-chaos && gradle --no-daemon clean build
      - name: Upload server mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rotbound-daily-chaos
          path: rotbound-daily-chaos/build/libs/rotbound_daily_chaos-*.jar
          if-no-files-found: error
          retention-days: 30
